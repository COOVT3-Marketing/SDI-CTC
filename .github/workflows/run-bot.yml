name: Run Mobile Click to Call Bot

on:
  workflow_dispatch:
    inputs:
      user_state:
        description: 'Target US State for Decodo IP (e.g. California, Texas, Florida)'
        required: false
        default: 'California'
  schedule:
    - cron: '0 */3 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Click-to-Call Bot
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          USER_STATE: ${{ github.event.inputs.user_state || 'California' }}
          LANDING_PAGE_URL: 'https://securedrive-insurance.com/quotes/'
        run: npm start
