name: Run Mobile Click to Call Bot

on:
  repository_dispatch:
    types: [form_submitted]

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Click-to-Call Bot with Virtual Display
        uses: GabrielBB/xvfb-action@v1
        with:
          run: npm start
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          USER_STATE: ${{ github.event.client_payload.user_state || 'California' }}
          USER_PHONE: ${{ github.event.client_payload.user_phone || '' }}
          LANDING_PAGE_URL: 'https://securedrive-insurance.com/quotes/'
